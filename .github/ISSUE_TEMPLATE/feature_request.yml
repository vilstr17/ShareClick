name: Feature Request
description: Suggest an idea or improvement
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: Briefly describe the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Why would it be useful?
      description: Tell us how this would improve your setup or workflow.
