name: Bug Report
description: Something isn't working as expected
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ShareClick is under active development. Thanks for helping us improve it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Briefly describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: List the steps, if known.

  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: ShareClick version and operating systems on both machines.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Add logs, screenshots, or other useful details. This is optional.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues before submitting.
          required: true
